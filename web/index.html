<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Qoder 账号</title>
  <script>
    (function () {
      var mode = 'system';
      try { mode = localStorage.getItem('qoder-cpa-theme') || 'system'; } catch (error) { mode = 'system'; }
      if (mode !== 'light' && mode !== 'dark') mode = 'system';
      var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.dataset.themeMode = mode;
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-brand">
        <span class="brand-mark" aria-hidden="true">Q</span>
        <div class="topbar-copy">
          <strong>Qoder</strong>
          <span id="loaded-at">尚未刷新</span>
        </div>
      </div>
      <div class="topbar-actions">
        <label class="theme-label" for="theme-select">主题</label>
        <select id="theme-select" aria-label="界面主题">
          <option value="system">跟随系统</option>
          <option value="light">浅色</option>
          <option value="dark">深色</option>
        </select>
      </div>
    </header>
    <nav class="task-nav" id="task-nav" aria-label="Qoder 管理视图">
      <button type="button" class="nav-item is-active" data-view="accounts" aria-current="page">账号</button>
      <button type="button" class="nav-item" data-view="models" aria-current="false">模型</button>
      <button type="button" class="nav-item" data-view="activity" aria-current="false">活动</button>
      <button type="button" class="nav-item" data-view="connection" aria-current="false">连接与诊断</button>
    </nav>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <main id="main" tabindex="-1"><div id="view-root"></div></main>
  </div>

  <dialog id="account-dialog" class="sheet" aria-labelledby="account-dialog-title">
    <div class="sheet-inner">
      <header class="sheet-header">
        <div>
          <h2 id="account-dialog-title">编辑账号</h2>
          <p class="muted" id="account-dialog-sub"></p>
        </div>
        <button type="button" class="icon-button" id="account-dialog-close" aria-label="关闭编辑面板">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div class="sheet-body" id="account-dialog-body"></div>
      <footer class="sheet-footer">
        <span class="sheet-status" id="account-edit-status"></span>
        <button type="button" class="button ghost" id="account-dialog-cancel">取消</button>
      </footer>
    </div>
  </dialog>

  <dialog id="login-dialog" class="dialog-center" aria-labelledby="login-dialog-title">
    <div class="dialog-inner">
      <header class="dialog-header">
        <h2 id="login-dialog-title">添加账号</h2>
        <button type="button" class="icon-button" id="login-dialog-close" aria-label="关闭添加账号面板">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div class="dialog-body">
        <p class="muted">授权由 CPA 原生 Qoder OAuth 流程处理，完成后会自动读取账号。</p>
        <fieldset class="choice-field">
          <legend>选择站点</legend>
          <label class="choice-card">
            <input type="radio" name="login-site" value="global" checked>
            <span><strong>国际站</strong><small>国际 API2 / API3 / Bearer 账号</small></span>
          </label>
          <label class="choice-card">
            <input type="radio" name="login-site" value="cn">
            <span><strong>国内站</strong><small>国内站账号</small></span>
          </label>
        </fieldset>
        <p class="inline-status" id="login-status" role="status" aria-live="polite"></p>
      </div>
      <footer class="dialog-footer">
        <button type="button" class="button ghost" id="login-cancel" hidden>停止等待</button>
        <button type="button" class="button primary" id="login-start">开始授权</button>
      </footer>
    </div>
  </dialog>

  <dialog id="delete-dialog" class="dialog-center" aria-labelledby="delete-title" aria-describedby="delete-message">
    <div class="dialog-inner">
      <header class="dialog-header"><h2 id="delete-title">删除账号</h2></header>
      <div class="dialog-body">
        <p id="delete-message"></p>
        <p class="muted">删除会移除宿主中的凭证文件，需重新登录才能恢复。</p>
      </div>
      <footer class="dialog-footer">
        <button type="button" class="button ghost" id="delete-cancel">取消</button>
        <button type="button" class="button danger" id="delete-confirm">删除账号</button>
      </footer>
    </div>
  </dialog>

  <script src="api.js"></script>
  <script src="views.js"></script>
  <script src="app.js"></script>
</body>
</html>
