<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Qoder</title>
  <style>
    :root { color-scheme: light dark; font: 15px system-ui, sans-serif; --bg:#f5f7fb; --panel:#fff; --ink:#182230; --muted:#667085; --line:#d9dee8; --accent:#2563eb; }
    @media (prefers-color-scheme: dark) { :root { --bg:#101318; --panel:#191e27; --ink:#f2f4f7; --muted:#98a2b3; --line:#303846; } }
    * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--ink); } main { max-width:980px; margin:auto; padding:24px; }
    header { display:flex; justify-content:space-between; gap:16px; align-items:center; margin-bottom:20px; } h1 { margin:0; font-size:24px; } button, select { font:inherit; border:1px solid var(--line); border-radius:6px; padding:8px 12px; background:var(--panel); color:var(--ink); } button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
    section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; margin-top:16px; overflow:auto; } table { width:100%; border-collapse:collapse; min-width:620px; } th,td { text-align:left; padding:11px 10px; border-bottom:1px solid var(--line); white-space:nowrap; } th { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; } .muted { color:var(--muted); } .status { min-height:22px; margin:8px 0; color:var(--muted); }
  </style>
</head>
<body><main>
  <header><div><h1>Qoder accounts</h1><div class="muted">Login is handled by CPA's native Qoder OAuth flow.</div></div><button class="primary" id="login">Log in with Qoder</button></header>
  <div class="status" id="status" role="status"></div>
  <section><table><thead><tr><th>Account</th><th>Email</th><th>Status</th><th>Transport</th><th></th></tr></thead><tbody id="accounts"><tr><td colspan="5" class="muted">Loading...</td></tr></tbody></table></section>
  <script>
    const $ = (id) => document.getElementById(id);
    const status = (text) => { $('status').textContent = text; };
    function managementKey() { const names = ['cliproxyapi-management-key','management-key','cpa-management-key','remote-management-key','managementKey','mgmt_key']; for (const name of names) { const value = localStorage.getItem(name); if (value && value.length > 4 && !value.startsWith('$2')) return value; } return ''; }
    async function api(path, options = {}) { const key = managementKey(); if (!key) throw new Error('missing management key'); const headers = new Headers(options.headers || {}); headers.set('Authorization', 'Bearer ' + key); headers.set('X-Management-Key', key); const response = await fetch('/v0/management' + path, { ...options, headers }); let body; try { body = await response.json(); } catch (e) { if (!response.ok) throw new Error('Request failed with HTTP ' + response.status); throw e; } if (!response.ok) throw new Error((body && body.error) || 'Request failed'); return body; }
    async function load() { try { const body = await api('/qoder/accounts'); $('accounts').innerHTML = body.accounts.length ? body.accounts.map(account => `<tr><td>${escapeHTML(account.label || account.name)}</td><td>${escapeHTML(account.email || '-')}</td><td>${escapeHTML(account.status || '-')}</td><td><select data-auth="${escapeHTML(account.auth_index)}"><option value="cosy-api2" ${account.transport_profile === 'cosy-api2' ? 'selected' : ''}>COSY API2</option><option value="cosy-api3" ${account.transport_profile === 'cosy-api3' ? 'selected' : ''}>COSY API3</option><option value="bearer-openai" ${account.transport_profile === 'bearer-openai' ? 'selected' : ''}>Bearer OpenAI</option></select></td><td><button data-save="${escapeHTML(account.auth_index)}">Save</button></td></tr>`).join('') : '<tr><td colspan="5" class="muted">No Qoder accounts. Start login to add one.</td></tr>'; document.querySelectorAll('[data-save]').forEach(button => button.onclick = () => save(button.dataset.save)); } catch (error) { status(error.message); } }
    async function save(authIndex) { const select = document.querySelector(`[data-auth="${CSS.escape(authIndex)}"]`); try { await api('/qoder/accounts/profile', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({auth_index:authIndex, transport_profile:select.value}) }); status('Transport profile saved.'); } catch (error) { status(error.message); } }
    let pollTimer = null;
    $('login').onclick = async () => { if (pollTimer) clearInterval(pollTimer); try { const body = await api('/qoder-auth-url'); if (!body.url) throw new Error(body.error || 'Unable to start login'); window.open(body.url, '_blank', 'noopener'); $('status').innerHTML = 'Waiting for Qoder authorization... If window did not open, <a href="' + escapeHTML(body.url) + '" target="_blank" rel="noopener">click here to authorize</a>.'; const state = body.state; pollTimer = setInterval(async () => { try { const res = await api('/get-auth-status?state=' + encodeURIComponent(state)); if (res.status === 'ok') { clearInterval(pollTimer); pollTimer = null; status('Login successful! Account added.'); load(); } else if (res.status === 'error') { clearInterval(pollTimer); pollTimer = null; status('Login failed: ' + (res.error || 'unknown error')); } } catch (e) {} }, 2500); } catch (error) { status(error.message); } };
    function escapeHTML(value) { return String(value).replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character])); }
    load();
  </script>
</main></body></html>
