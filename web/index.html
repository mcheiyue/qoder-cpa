<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Qoder 账号</title>
  <style>
    :root { color-scheme: light dark; font: 15px system-ui, sans-serif; --bg:#f5f7fb; --panel:#fff; --ink:#182230; --muted:#667085; --line:#d9dee8; --accent:#2563eb; }
    @media (prefers-color-scheme: dark) { :root { --bg:#101318; --panel:#191e27; --ink:#f2f4f7; --muted:#98a2b3; --line:#303846; } }
    * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--ink); } main { max-width:980px; margin:auto; padding:24px; }
    header { display:flex; justify-content:space-between; gap:16px; align-items:center; margin-bottom:12px; } h1 { margin:0; font-size:24px; } button, select, input { font:inherit; border:1px solid var(--line); border-radius:6px; padding:8px 12px; background:var(--panel); color:var(--ink); } button.primary { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; } button { cursor:pointer; }
    .key-bar { display:flex; gap:8px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin-bottom:16px; font-size:13px; }
    .key-bar input { flex:1; max-width:360px; padding:6px 10px; font-size:13px; }
    .key-bar label { color:var(--muted); white-space:nowrap; font-weight:500; }
    section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; margin-top:16px; overflow:auto; } table { width:100%; border-collapse:collapse; min-width:620px; } th,td { text-align:left; padding:11px 10px; border-bottom:1px solid var(--line); white-space:nowrap; } th { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; } .muted { color:var(--muted); } .status { min-height:22px; margin:8px 0; color:var(--muted); }
  </style>
</head>
<body><main>
  <header><div><h1>Qoder 账号</h1><div class="muted">登录由 CPA 原生 Qoder OAuth 流程处理。</div></div><button class="primary" id="login">使用 Qoder 登录</button></header>
  <div class="key-bar" id="key-bar">
    <label for="mgmt-key">管理密钥：</label>
    <input type="password" id="mgmt-key" placeholder="输入 CPA Management Key（自动记住）" autocomplete="off" spellcheck="false">
    <button id="save-key">连接并保存</button>
    <button id="clear-key" style="display:none;">清除密钥</button>
    <span class="muted" id="key-hint" style="font-size:12px;"></span>
  </div>
  <div class="status" id="status" role="status"></div>
  <section><table><thead><tr><th>账号</th><th>邮箱</th><th>状态</th><th>传输方式</th><th></th></tr></thead><tbody id="accounts"><tr><td colspan="5" class="muted">正在加载...</td></tr></tbody></table></section>
  <script>
    const $ = (id) => document.getElementById(id);
    const status = (text) => { $('status').textContent = text; };
    const KEY_LS = 'qoder-cpa-mgmt-key';
    const PANEL_STORE_KEY = 'cli-proxy-auth';
    const PANEL_KEY = 'managementKey';
    const PANEL_PREFIX = 'enc::v1::';
    const PANEL_SALT = 'cli-proxy-api-webui::secure-storage';
    function panelDeobfuscate(raw) { if (typeof raw !== 'string' || !raw.startsWith(PANEL_PREFIX)) return raw; const secret = new TextEncoder().encode(PANEL_SALT + '|' + location.host + '|' + navigator.userAgent); const binary = atob(raw.slice(PANEL_PREFIX.length)); const bytes = new Uint8Array(binary.length); for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i) ^ secret[i % secret.length]; return new TextDecoder().decode(bytes); }
    function panelStoredValue(name) { try { const raw = localStorage.getItem(name); return raw ? JSON.parse(panelDeobfuscate(raw)) : null; } catch (_) { return null; } }
    function tryPanelKey() { const session = panelStoredValue(PANEL_STORE_KEY); const fromSession = session && session.state && session.state.managementKey; if (typeof fromSession === 'string' && fromSession.trim()) return fromSession.trim(); const stored = panelStoredValue(PANEL_KEY); if (typeof stored === 'string' && stored.trim()) return stored.trim(); const names = ['cliproxyapi-management-key','management-key','cpa-management-key','remote-management-key','managementKey','mgmt_key']; for (const name of names) { const value = localStorage.getItem(name); if (value && value.length > 4 && !value.startsWith('$2')) return value; } return ''; }
    function managementKey() { const input = $('mgmt-key'); const fromInput = (input && input.value || '').trim(); if (fromInput) return fromInput; try { const local = (localStorage.getItem(KEY_LS) || '').trim(); if (local) return local; } catch (_) {} return tryPanelKey(); }
    function updateKeyUI() { const k = managementKey(); const input = $('mgmt-key'); if (input && !input.value) { try { input.value = localStorage.getItem(KEY_LS) || ''; } catch (_) {} } const clearBtn = $('clear-key'); const hint = $('key-hint'); if (clearBtn) clearBtn.style.display = localStorage.getItem(KEY_LS) ? 'inline-block' : 'none'; if (hint) { if (localStorage.getItem(KEY_LS)) { hint.textContent = '已保存自留密钥'; } else if (k) { hint.textContent = '已自动借用面板密钥'; } else { hint.textContent = '未连接'; } } }
    $('save-key').onclick = () => { const val = ($('mgmt-key').value || '').trim(); if (!val) { status('请输入有效的 Management Key'); return; } try { localStorage.setItem(KEY_LS, val); } catch (_) {} updateKeyUI(); status('管理密钥已保存，正在重新加载账号列表…'); load(); };
    $('clear-key').onclick = () => { try { localStorage.removeItem(KEY_LS); } catch (_) {} if ($('mgmt-key')) $('mgmt-key').value = ''; updateKeyUI(); status('已清除自留管理密钥'); load(); };
    async function api(path, options = {}) { const key = managementKey(); if (!key) throw new Error('未检测到管理密钥，请在上方输入框填入 CPA Management Key 并点保存，或在 CPAMP 面板完成配置。'); const headers = new Headers(options.headers || {}); headers.set('Authorization', 'Bearer ' + key); headers.set('X-Management-Key', key); const response = await fetch('/v0/management' + path, { ...options, headers }); let body; try { body = await response.json(); } catch (e) { if (!response.ok) throw new Error('请求失败，HTTP ' + response.status); throw e; } if (!response.ok) throw new Error((body && body.error) || '请求失败'); return body; }
    function renderError(message) { $('accounts').innerHTML = `<tr><td colspan="5" class="muted">${escapeHTML(message)}</td></tr>`; }
    async function load() { try { const body = await api('/qoder/accounts'); $('accounts').innerHTML = body.accounts.length ? body.accounts.map(account => `<tr><td>${escapeHTML(account.label || account.name)}</td><td>${escapeHTML(account.email || '-')}</td><td>${escapeHTML(account.status || '-')}</td><td><select data-auth="${escapeHTML(account.auth_index)}"><option value="cosy-api2" ${account.transport_profile === 'cosy-api2' ? 'selected' : ''}>COSY API2</option><option value="cosy-api3" ${account.transport_profile === 'cosy-api3' ? 'selected' : ''}>COSY API3</option><option value="bearer-openai" ${account.transport_profile === 'bearer-openai' ? 'selected' : ''}>Bearer OpenAI</option></select></td><td><button data-save="${escapeHTML(account.auth_index)}">保存</button></td></tr>`).join('') : '<tr><td colspan="5" class="muted">暂无 Qoder 账号，请先登录。</td></tr>'; document.querySelectorAll('[data-save]').forEach(button => button.onclick = () => save(button.dataset.save)); } catch (error) { status(error.message); renderError(error.message); } }
    async function save(authIndex) { const select = document.querySelector(`[data-auth="${CSS.escape(authIndex)}"]`); try { await api('/qoder/accounts/profile', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({auth_index:authIndex, transport_profile:select.value}) }); status('传输方式已保存。'); } catch (error) { status(error.message); } }
    let pollTimer = null;
    $('login').onclick = async () => { if (pollTimer) clearInterval(pollTimer); try { const body = await api('/qoder-auth-url'); if (!body.url) throw new Error(body.error || '无法启动登录'); window.open(body.url, '_blank', 'noopener'); $('status').innerHTML = '等待 Qoder 授权……如果没有自动打开，请<a href="' + escapeHTML(body.url) + '" target="_blank" rel="noopener">点击此处授权</a>。'; const state = body.state; pollTimer = setInterval(async () => { try { const res = await api('/get-auth-status?state=' + encodeURIComponent(state)); if (res.status === 'ok') { clearInterval(pollTimer); pollTimer = null; status('登录成功，账号已保存。'); load(); } else if (res.status === 'error') { clearInterval(pollTimer); pollTimer = null; status('登录失败：' + (res.error || '未知错误')); } } catch (error) { clearInterval(pollTimer); pollTimer = null; status(error.message); } }, 2500); } catch (error) { status(error.message); } };
    function escapeHTML(value) { return String(value).replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character])); }
    updateKeyUI();
    load();
  </script>
</main></body></html>
